<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandra Noël · RUAH Ministry</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Jost',sans-serif;background:#FFFFFF;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{width:400px;background:#0F4A32;border-radius:16px;padding:36px 32px;position:relative;overflow:hidden;box-shadow:0 24px 60px rgba(15,74,50,0.35),0 8px 20px rgba(0,0,0,0.15)}
.card::before{content:'רוּחַ';position:absolute;right:-20px;bottom:-20px;font-family:'Playfair Display',serif;font-size:160px;font-weight:700;color:rgba(201,168,76,0.06);letter-spacing:-6px;line-height:1;pointer-events:none}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(to right,transparent,#C9A84C,transparent)}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;position:relative;z-index:1}
.logo{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:white;letter-spacing:5px}
.logo span{color:#C9A84C}
.logo-sub{font-size:9px;font-style:italic;color:rgba(255,255,255,0.4);margin-top:4px;font-family:'Playfair Display',serif}
.photo{width:60px;height:60px;border-radius:50%;border:2px solid #C9A84C;overflow:hidden;flex-shrink:0;background:rgba(201,168,76,0.15);display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center top}
.photo span{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:#C9A84C}
.name{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:white;margin-bottom:6px;position:relative;z-index:1}
.titre{font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#C9A84C;line-height:1.8;margin-bottom:24px;position:relative;z-index:1}
.divider{width:40px;height:1px;background:rgba(201,168,76,0.4);margin-bottom:20px;position:relative;z-index:1}
.contacts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px;position:relative;z-index:1}
.contact-label{font-size:8px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#C9A84C;margin-bottom:3px}
.contact-value{font-size:11px;color:rgba(255,255,255,0.8);line-height:1.5}
.verset{font-family:'Playfair Display',serif;font-size:10px;font-style:italic;color:rgba(255,255,255,0.35);text-align:center;line-height:1.7;padding-top:16px;border-top:1px solid rgba(201,168,76,0.15);position:relative;z-index:1}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div>
      <div class="logo">RU<span>A</span>H</div>
      <div class="logo-sub">Là où le souffle devient vie.</div>
    </div>
    <div class="photo">
      <img src="photo-sandra.jpg" alt="Sandra" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span style="display:none">S</span>
    </div>
  </div>
  <div class="name">Sandra Noël</div>
  <div class="titre">Coach en Reprogrammation Emotionnelle<br>Fondatrice de RUAH Ministry</div>
  <div class="divider"></div>
  <div class="contacts">
    <div><div class="contact-label">Email</div><div class="contact-value">contact@ruah-ministere.fr</div></div>
    <div><div class="contact-label">Téléphone</div><div class="contact-value">06 58 09 46 84</div></div>
    <div><div class="contact-label">Site web</div><div class="contact-value">ruah-ministere.fr</div></div>
    <div><div class="contact-label">Réseaux</div><div class="contact-value">@sandra_noel</div></div>
  </div>
  <div class="verset">« L'Éternel est en ce lieu — et je ne le savais pas. » · Genèse 28:16</div>
</div>
</body>
</html>
